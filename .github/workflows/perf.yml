name: Speed benchmark

# Times the PR's brains against its base branch on a fixed set of positions
# (see `gomoku bench` in the README).  Base and PR alternate on every
# position, so runner noise affects both alike.  Fails when a brain thinks
# more than 25% slower; the run summary shows timings by phase, the largest
# slowdowns, changed moves and a profile of the PR's brain.
on:
  pull_request:
    paths:
      - "packages/gomoku/src/**"
      - "packages/gomoku-brain/src/**"
      - "gomoku.toml"
      - "packages/gomoku-cli/src/gomoku_cli/match.py"
      - "packages/gomoku-cli/src/gomoku_cli/match_worker.py"
      - "packages/gomoku-cli/src/gomoku_cli/bench.py"
      - "packages/gomoku-cli/src/gomoku_cli/bench_positions.json"
  workflow_dispatch:
    inputs:
      base:
        description: "Baseline revision"
        default: "origin/master"

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        brain: [threat, alphabeta]
    env:
      BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the baseline revision is exported from history
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-packages --frozen
      - name: Benchmark
        run: |
          set -o pipefail
          uv run gomoku bench --a "brain=${{ matrix.brain }},rev=$BASE" --b brain=${{ matrix.brain }} \
            --repeat 3 --profile 25 --out bench-${{ matrix.brain }}.json | tee bench.txt
      - name: Summary
        if: always()
        run: |
          { echo '### Speed: ${{ matrix.brain }}'; echo '```'; cat bench.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.brain }}
          path: bench-${{ matrix.brain }}.json
          if-no-files-found: ignore
