name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14t (free-threaded, no GIL) is the project's interpreter, see
        # .python-version; plain 3.14 must keep working too.
        python: ["3.14t", "3.14"]
    name: test (${{ matrix.python }})
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-packages --frozen
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Format
        run: uv run ruff format --check --diff .
      - name: Type check
        run: uv run pyright
      - name: Test
        run: uv run pytest -q

  bench:
    # Opt-in: only on manual dispatch (benchmarks are slow and noisy on shared runners).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen
      - run: uv run pytest -q -m bench
