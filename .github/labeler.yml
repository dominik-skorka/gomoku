# Area labels for pull requests, from the paths they change
# (.github/workflows/labeler.yml).  Issues get theirs from the issue forms.
"area:web":
  - changed-files:
      - any-glob-to-any-file: ["web/**"]
"area:api":
  - changed-files:
      - any-glob-to-any-file: ["packages/gomoku-fastapi/**", "scripts/export_openapi.py"]
"area:engine":
  - changed-files:
      - any-glob-to-any-file: ["packages/gomoku/**", "packages/gomoku-brain/**", "packages/gomoku-cli/**", "gomoku.toml"]
"area:infra":
  - changed-files:
      - any-glob-to-any-file: ["deploy/**", "compose*.yaml", ".github/**", "**/Dockerfile", ".dockerignore"]
"area:docs":
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "**/*.md"]
