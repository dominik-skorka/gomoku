[project]
name = "gomoku-fastapi"
version = "0.1.0"
description = "REST API exposing the Gomoku engine via FastAPI"
requires-python = ">=3.14"
dependencies = [
    "gomoku",
    "gomoku-brain",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "logfire>=4.0",
]

[tool.uv.sources]
gomoku = { workspace = true }
gomoku-brain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "library-skills>=0.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gomoku_fastapi"]

[project.scripts]
gomoku-api = "gomoku_fastapi.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
