[project]
name = "gomoku-fastapi"
version = "0.5.0"
description = "REST API exposing the Gomoku engine via FastAPI"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "gomoku",
    "gomoku-brain",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.34",
    "logfire[fastapi]>=6.0.0",
    "slowapi>=0.1.10",
]

[tool.uv.sources]
gomoku = { workspace = true }
gomoku-brain = { workspace = true }

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "library-skills>=0.0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gomoku_fastapi"]

[project.scripts]
gomoku-api = "gomoku_fastapi.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
