[project]
name = "gomoku-cli"
version = "0.1.0"
description = "Gomoku CLI frontend — play games from the terminal"
requires-python = ">=3.14"
dependencies = [
    "gomoku",
    "gomoku-brain",
    "click>=8.1",
    "rich>=14.0",
    "logfire>=4.0",
]

[tool.uv.sources]
gomoku = { workspace = true }
gomoku-brain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gomoku_cli"]

[project.scripts]
gomoku = "gomoku_cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
