[project]
name = "gomoku-brain"
version = "0.1.0"
description = "Gomoku AI brains — minimax, negamax, alpha-beta, random"
requires-python = ">=3.14"
dependencies = [
    "gomoku",
    "logfire>=4.0",
]

[tool.uv.sources]
gomoku = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gomoku_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
