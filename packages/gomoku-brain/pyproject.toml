[project]
name = "gomoku-brain"
version = "0.1.0"
description = "Gomoku AI brains — minimax, negamax, alpha-beta, random"
requires-python = ">=3.14"
dependencies = [
    "gomoku",
    "logfire>=6.0.0",
    "numba>=0.68.1",
    "numpy>=2.5.5",
]

[tool.uv.sources]
gomoku = { workspace = true }

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gomoku_brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
