[project]
name = "gomoku"
version = "0.1.0"
description = "Gomoku core engine — board, rules, and game loop"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "pydantic>=2.14.4",
    "logfire>=6.0.0",
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gomoku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
