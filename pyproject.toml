[project]
name = "gomoku-workspace"
version = "0.1.0"
description = "Gomoku (Five in a Row) game workspace"
requires-python = ">=3.14"
dependencies = [
    "gomoku",
    "gomoku-brain",
    "gomoku-cli",
    "gomoku-fastapi",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
gomoku = { workspace = true }
gomoku-brain = { workspace = true }
gomoku-cli = { workspace = true }
gomoku-fastapi = { workspace = true }

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
    "TID251", # banned imports (below)
]
# "×" is used deliberately in comments, docstrings and user-facing output.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Python 3.14 evaluates annotations lazily (PEP 649/749): forward references
# and TYPE_CHECKING-only names in annotations work without it.
"__future__.annotations".msg = "not needed on Python 3.14 (annotations are evaluated lazily)"

[tool.pytest.ini_options]
testpaths = [
    "packages/gomoku/tests",
    "packages/gomoku-brain/tests",
    "packages/gomoku-cli/tests",
    "packages/gomoku-fastapi/tests",
]
markers = [
    "bench: slow benchmarks (opt-in via `-m bench`)",
]
addopts = "-m 'not bench'"

[tool.pyright]
# Static type checking in CI.  The interfaces in gomoku.interfaces (and the
# brain base class) only mean something if a checker enforces them.
include = ["packages/gomoku/src", "packages/gomoku-brain/src", "packages/gomoku-cli/src", "packages/gomoku-fastapi/src"]
pythonVersion = "3.14"
typeCheckingMode = "basic"
# An overriding method must say so with @typing.override, so renaming or
# misspelling the base method is an error instead of a silent new method.
reportImplicitOverride = "error"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "httpx2>=2.16.2",
    "pyright[nodejs]>=1.1.414",
]
