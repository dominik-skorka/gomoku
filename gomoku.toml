# =============================================================================
# Gomoku Configuration
# =============================================================================
# Settings priority (highest → lowest):
#   1. CLI flags / programmatic overrides
#   2. Environment variables (GOMOKU_* prefix, __ for nesting)
#   3. This file (gomoku.toml)
#   4. Built-in defaults
#
# Brain aliases are defined under [brains.<name>]. Each alias specifies a
# "type" (brain engine) and optional parameter overrides. Valid brain types:
#   keyboard, random, minimax, negamax, alphabeta, threat, mcts
# =============================================================================

[game]
# Board dimensions (NxN grid).
# Default: 15 | Valid range: 5–25
board_size = 15

# Number of consecutive stones needed to win.
# Default: 5 | Valid range: 3–board_size
win_length = 5

# -----------------------------------------------------------------------------
# Brain: minimax — Classic minimax search (educational, no pruning)
# -----------------------------------------------------------------------------
[brains.minimax]
# Brain engine to use.
# Valid values: "minimax", "negamax", "alphabeta", "threat", "mcts", "random"
type = "minimax"

# Search depth in plies (half-moves).
# Default: 3 | Valid range: 1–10 | Higher = stronger but exponentially slower
depth = 3

# Static evaluation and candidate moves, by name (gomoku.strategies; same
# keys in negamax, alphabeta, the threat brain's fallback, and evaluator in
# mcts).  An unknown name is an error listing the registered ones.
# Default: "pattern" / "radius" | Built-ins: "pattern", "pattern_open3" / "radius"
# "pattern_open3" (open-three bonus 3_000 instead of 1_500) vs "pattern",
# alpha-beta depth 10 at time_limit_s = 0.4: +28 Elo (95% interval +1 to
# +55, 300 games, #105); confirmed on other openings (--seed 2): +50 Elo
# (+16 to +85, 300 games).  Screened at depth 3 (100 games each): dead four
# x3, live three x2, fork bonus x2, live two x3 all within +-7 Elo.
# evaluator = "pattern"
# move_generator = "radius"

# -----------------------------------------------------------------------------
# Brain: negamax — Negamax simplification of minimax with alpha-beta pruning
# -----------------------------------------------------------------------------
[brains.negamax]
# Brain engine to use.
type = "negamax"

# Search depth in plies.
# Default: 3 | Valid range: 1–10
depth = 3

# -----------------------------------------------------------------------------
# Brain: alphabeta — Negamax + alpha-beta pruning, move ordering, killer
# heuristic, VCF pre-checks, threat extensions, null-move pruning, LMR
# -----------------------------------------------------------------------------
[brains.alphabeta]
# Brain engine to use.
type = "alphabeta"

# Main search depth in plies.
# Default: 4 | Valid range: 1–10
depth = 4

# Root-level VCF (Victory by Continuous Fours) search depth.
# Checks for forced wins via four-threats before alpha-beta.
# Default: 0 (disabled) | Valid range: 0–40 | Typical: 20
vcf_depth = 20

# When the opponent has a VCF, PNS budget per VCF breaker for checking it
# leaves the opponent no other forced win (breakers tried best evaluation
# first, vcf_breaker_time_s seconds in all).  0 picks by evaluation only.
# 10_000 beat 0 by +56 Elo (95% interval +29 to +84, 300 games), with no
# extra think time; 30_000 ran out of time on a position 10_000 solved.
# Default: 0 | Valid range: 0–1_000_000
vcf_breaker_pns_nodes = 10_000
# Default: 2.0 | Valid range: 0.1–60.0
vcf_breaker_time_s = 2.0

# Threads that probe candidate moves in parallel for the opponent's forced
# win (the VCF breaker probes above).  The move chosen is the one a single thread
# would choose from the same probe results (the first safe candidate in
# evaluation order, not the first to finish), but more threads probe more
# candidates before the time cap (vcf_breaker_time_s) runs out.
# - Pays off only on a free-threaded Python (python3.14t), where the probes
#   really run at once; with the GIL they take turns: no speed-up, a little
#   overhead.  Values above the number of CPU cores only add overhead.
# - Matches played with `gomoku match --jobs N` already keep N cores busy:
#   give the brains threads only with spare cores, or the comparison is
#   skewed.
# Default: 1 | Valid range: 1–64
probe_threads = 1

# VCF depth limit inside quiescence search (at frontier nodes).
# Default: 0 (disabled) | Valid range: 0–40 | Typical: 12
qs_vcf_depth = 12

# Promote four-threat and three-threat moves to head of move ordering.
# Default: true | Valid values: true, false
threat_ordering = true

# Max extra plies to search on forcing (threat) moves.
# Default: 0 (disabled) | Valid range: 0–8 | Typical: 2
threat_extensions = 2

# Enable pass-a-turn (null-move) pruning on non-PV nodes.
# Reduces branching factor by assuming the opponent can't improve by passing.
# Default: false | Valid values: true, false
null_move_pruning = true

# Depth reduction R for null-move search (search at depth − R after a pass).
# Default: 2 | Valid range: 1–4
null_move_reduction = 2

# Enable Late Move Reduction — search later moves in move order at reduced depth.
# Assumes moves ordered later are less likely to be best.
# Default: false | Valid values: true, false
lmr = true

# Move index (0-based) from which LMR kicks in.
# First N moves are always searched at full depth.
# Default: 3 | Valid range: 2–10
lmr_threshold = 3

# Minimum remaining depth to apply LMR.
# Default: 3 | Valid range: 2–10
lmr_min_depth = 3

# Candidate generation radius in the opening (fewer occupied cells).
# Reduces branching factor when stones are sparse and distant cells add no value.
# Default: 1 | Valid range: 1–2
early_game_radius = 1

# Maximum number of occupied cells to use the reduced early-game radius.
# Once the board has more stones, the full radius (2) is used.
# Default: 6 | Valid range: 2–15
early_game_threshold = 6

# Maximum candidate moves to evaluate per node during the early game
# (when occupied cells <= early_game_threshold). Mid-game uses 20.
# Default: 10 | Valid range: 5–20
early_game_max_candidates = 10

# LMR move index threshold during the early game.
# Lower than the normal threshold to start reducing moves earlier when
# evaluations cluster tightly.
# Default: 2 | Valid range: 1–10
early_game_lmr_threshold = 2

# Futility pruning margin during the early game.
# Smaller than the normal margin (1500) because opening evaluations are
# tightly grouped — a narrower window prunes more aggressively.
# Default: 800 | Valid range: 200–1500
early_game_futility_margin = 800

# Hard time limit per move in seconds. 0 = unlimited.
# Ensures the brain always returns within this budget by aborting deeper
# iterative-deepening passes and returning the best move found so far.
# Default: 0 | Valid range: 0–600
time_limit_s = 120.0

# Static evaluation, by name (see [brains.minimax]).  "pattern_open3" doubles
# the open-three bonus: vs "pattern", depth 10 at time_limit_s = 0.4, +28 Elo
# (95% interval +1 to +55, 300 games) and +50 (+16 to +85, 300 games, other
# openings), #105.
# Default: "pattern"
evaluator = "pattern_open3"

# -----------------------------------------------------------------------------
# Brain: alphabeta_depth_6 — Deeper alpha-beta variant (stronger, slower)
# -----------------------------------------------------------------------------
[brains.alphabeta_depth_6]
type = "alphabeta"

# Default: 4 | Overridden here to 6 for deeper search
depth = 6

# Root-level VCF depth. Default: 0 | Typical: 20
vcf_depth = 20

# Quiescence VCF depth. Default: 0
# Compromise: 6 gives meaningful tactical vision without blowing the time budget.
qs_vcf_depth = 6

# Promote threat moves in move ordering. Default: true
threat_ordering = true

# Extra plies on forcing moves. Default: 0
# Raised from 1 → 2: effective depth 8 on forcing lines; bounded cost.
threat_extensions = 2

# Null-move pruning. Default: false
null_move_pruning = true

# Null-move depth reduction R. Default: 2
# R=2 is stable; R=3 caused eval instability via too-shallow null probes.
null_move_reduction = 2

# Late Move Reduction. Default: false
lmr = true

# LMR move index threshold. Default: 3
# Lowered from 3 → 2: start reducing earlier to save time budget.
lmr_threshold = 2

# LMR minimum depth. Default: 3
# Lowered from 3 → 2: apply LMR at shallower nodes too.
lmr_min_depth = 2

# Early-game candidate radius. Default: 1
early_game_radius = 1

# Max occupied cells for reduced radius. Default: 6
early_game_threshold = 6

# Early-game max candidates per node. Default: 10
# Lowered from 10 → 8: tighter cap saves time in sparse positions.
early_game_max_candidates = 8

# Early-game LMR threshold. Default: 2
early_game_lmr_threshold = 2

# Early-game futility margin. Default: 800
# Lowered from 800 → 600: narrower window prunes more in opening.
early_game_futility_margin = 600

# Hard time limit per move in seconds. 0 = unlimited.
time_limit_s = 120.0

# -----------------------------------------------------------------------------
# Brain: threat — VCF/VCT search with PNS or depth-limited VCT fallback,
# plus alpha-beta as final fallback
# -----------------------------------------------------------------------------
[brains.threat]
type = "threat"

# Alpha-beta fallback depth (used when threat search finds no forced win).
# Only used when there is no [brains.threat.fallback] table below; the
# table sets its own depth.
# Default: 4 | Valid range: 1–10
depth = 5

# VCF (Victory by Continuous Fours) search depth.
# Only attacker plays four-threats; defender forced to block single gap.
# Very forcing — allows deep search.
# Default: 20 | Valid range: 1–40
vcf_depth = 20

# VCT (Victory by Continuous Threats) search depth.
# Extends VCF to include live-three threats; defender has more options.
# Default: 12 | Valid range: 1–30
vct_depth = 12

# Algorithm for threat search after VCF fails.
# "pns" = Proof-Number Search (sound, slower)
# "vct" = depth-limited VCT (faster, may miss)
# Default: "pns" | Valid values: "pns", "vct"
threat_search = "pns"

# Max nodes explored by PNS before giving up.
# Default: 10_000 | Valid range: 1_000–10_000_000
# Measured with `gomoku match` (300 games each).  120_000 on the faster
# PNS of PR #55 beat 60_000 on the code before it by +47 Elo (95% interval
# +22 to +72) at about the same think time (954 vs 1027 ms per move).
# Earlier, with split fours seen (they make proofs larger), 60_000 had
# beaten 30_000 by +30 (+4 to +57), and before that 30_000 was the sweet
# spot (+43 over 10_000).
pns_nodes = 120_000


# Max wall-clock seconds for PNS search.
# Default: 5.0 | Valid range: 0.1–60.0
pns_time_s = 5.0

# Threads that probe candidate moves in parallel for the opponent's forced
# win (breaker probes after a VCT / VCF threat).  The move chosen is the one a single thread
# would choose from the same probe results (the first safe candidate in
# evaluation order, not the first to finish), but more threads probe more
# candidates before the time cap (pns_time_s) runs out.
# - Pays off only on a free-threaded Python (python3.14t), where the probes
#   really run at once; with the GIL they take turns: no speed-up, a little
#   overhead.  Values above the number of CPU cores only add overhead.
# - Matches played with `gomoku match --jobs N` already keep N cores busy:
#   give the brains threads only with spare cores, or the comparison is
#   skewed.
# Default: 1 | Valid range: 1–64
probe_threads = 1

# Alpha-beta tuning for the fallback used when no forced win is found
# (same keys as [brains.alphabeta]; keys left out take their defaults,
# and depth here overrides the top-level depth).
#
# Measured with `gomoku match` (300 games each, both colours per opening):
# - A depth-5 search that ranks moves by cheap pattern priors at every
#   node and keeps 12 candidates per node costs the same time as the
#   default depth-4 search, and beat it 183-117 (+78 Elo, 95% interval
#   +43 to +114).
# - A fallback tuned like [brains.alphabeta] (VCF probes, LMR, null-move)
#   scored 150-150 against the default while thinking ~43% longer.
[brains.threat.fallback]
# Search depth in plies.
depth = 5
# Nodes at least this deep order moves by evaluating each one; shallower
# nodes use pattern priors.  11 means priors everywhere at this depth.
# Default: 3 | Valid range: 1–11
eval_ordering_depth = 11
# Candidate moves kept per node after the early game.
# Default: 20 | Valid range: 5–60
max_candidates = 12
# Static evaluation of the fallback, as in [brains.alphabeta].  The whole
# threat brain with it vs "pattern": +8 Elo (95% interval -16 to +33, 300
# games, #105): no loss, kept for one evaluation across both brains.
# Default: "pattern"
evaluator = "pattern_open3"

# -- Threat spaces ------------------------------------------------------------
# Which threats the forced-win searches (VCF, PNS / VCT) play and answer.
# "own" is our search for a win, "opponent" the search for the opponent's
# (steps 5-6 and the breaker probes); "defence" is what the defender may
# reply inside both.  "Four" = one cell then completes five; "three" = one
# more stone makes a live four.  Defaults are the measured configuration.
#
# Fewer ATTACK threats only make a search less complete (fewer wins found,
# never false ones); more find more wins but widen the search, so the same
# pns_nodes proves less.  Fewer DEFENCE replies make proofs UNSOUND: the
# search "proves" wins that kind of reply refutes, and the brain plays them.

[brains.threat.threats.own]
# Fours.  false: no VCF; PNS / VCT attack with threes only.
fours = true
# Split fours (XXX_X, XX_XX) count as fours.  false: unbroken runs only,
# as before split fours were detected.
split_fours = true
# Threes.  false: PNS / VCT attack with fours only.
threes = true
# Split threes (_XX_X_) count as threes, defended at the gap or either end.
# Here only (our attack, at pns_nodes = 60_000): +7 Elo (95% interval -16
# to +30), 1.2x the think time.  With the opponent's searches too (at
# 30_000): -58 Elo (-92 to -26), 2.1x.
split_threes = false

[brains.threat.threats.opponent]
# The same switches for the opponent's threats: what we look for when
# checking whether the opponent has a forced win.  Fewer: the brain may not
# notice a win the opponent has; more: slower probes.
fours = true
split_fours = true
threes = true
split_threes = false

[brains.threat.threats.defence]
# Block the attacker's four.  false: every four "wins" -- false proofs.
block_fours = true
# Block the attacker's three (both ends; the gap and both ends of a split
# three).  false: a three is answered by counter-threats only -- false proofs.
block_threes = true
# The defender's own fours as replies.  false: an attack refuted by a
# counter-four is "proved" (the "K8" bug) -- false proofs.
counter_fours = true
# Split fours count as counter-fours.  false: an attack refuted by a split
# counter-four is "proved" (the F5/E9 bug) -- false proofs.
split_counter_fours = true
# The defender's own threes as replies (PNS).  A heuristic: proofs made of
# fours stay sound without them.  false: smaller, faster PNS.
counter_threes = true
# Split threes count as counter-threes.  true: wider PNS.
split_counter_threes = false
# Every cell that defuses an attacker's threat to make an unblockable four
# next move (PNS).  false: the bug fixed in PR #42 -- false proofs.
unblockable_four_defences = true

[brains.threat.threats.forks]
# Count split threes and fours (XX_X, XXX_X) as fork lines when looking for
# the opponent's fork cells to block.  true: -23 Elo (95% interval -40 to
# -7); the brain blocked more and attacked less.
split = false

# -----------------------------------------------------------------------------
# Brain: mcts — Monte Carlo Tree Search with PUCT formula, heuristic priors,
# Dirichlet noise, and heuristic leaf evaluation (AlphaGo Zero-inspired,
# no neural network)
# -----------------------------------------------------------------------------
[brains.mcts]
type = "mcts"

# Number of MCTS simulation iterations per move.
# Default: 10_000 | Valid range: 1–1_000_000 | Higher = stronger but slower
iterations = 10_000

# Hard time limit per move in seconds: the search stops at the deadline
# even if fewer iterations ran.  0 = unlimited (the API caps it at
# [api].max_time_limit_s).
# Default: 0 | Valid range: 0–600
time_limit_s = 0.0

# PUCT exploration constant (c) in: Q + c·P·√N/(n+1), with Q in [0, 1].
# Controls exploitation vs exploration balance.
# Measured with `gomoku match` (2 000 iterations): 1.0 vs 2.0 scored
# +35 Elo (95% interval -27 to +99, 100 games), then -9 (-53 to +36,
# 200 games, other openings): no difference, 2.0 kept.
# Default: 2.0 | Valid range: 0.1–5.0 | Lower = more exploitative
exploration = 2.0

# First Play Urgency: an untried move counts as a child whose Q is the
# node's value minus this reduction; the best untried move (by prior) is
# expanded only when its PUCT score beats every existing child.
# Default: 0.2 | Valid range: 0.0–1.0 | Higher = deeper, narrower tree
fpu_reduction = 0.2

# Opponent VCF depth for the root safety gate, and depth of our own root
# VCF search.  0 disables both.  20 vs 10 (100 games): +0 Elo (95%
# interval -21 to +21), ~3% more think time; 20 as in the other brains.
# Default: 10 | Valid range: 0–40
vcf_depth = 20

# Keep the subtree of the move played and continue from the opponent's
# reply on the next move (only when the same brain plays on, e.g. a game
# session or `gomoku play` / `match`; a stateless API move cannot reuse).
# On vs off (2 000 iterations): +38 Elo (95% interval -5 to +83, 100
# games), +24 (-6 to +55, 200 games, other openings).
# Default: false | Valid values: true, false
reuse_tree = true

# Dirichlet noise mixed into the root priors:
# (1−weight)·prior + weight·noise.  AlphaZero uses it to explore while
# generating self-play training data; this brain does not learn, so it is
# off by default.  Measured with `gomoku match` (100 games, 2 000
# iterations): weight 0.0 vs 0.25 scored 50.0% (+0 Elo, 95% interval -54
# to +54), at slightly less think time.
# alpha shapes the noise: AlphaZero scaled it inversely to the number of
# legal moves (0.3 chess, 0.15 shogi, 0.03 Go with ~361 moves); for the
# ~50 candidates of a gomoku root about 0.25 is the equivalent.
# Use the noise only to vary or weaken play.
# dirichlet_alpha  Default: 0.25 | Valid range: 0.0–1.0
# dirichlet_weight Default: 0.0 | Valid range: 0.0–1.0 | 0.0 = no noise
dirichlet_alpha = 0.25
dirichlet_weight = 0.0

# =============================================================================
# Evaluation Settings
# =============================================================================
[evaluation]
# Use Numba JIT-compiled evaluation for faster board scoring.
# Falls back to pure Python if numba is not installed.
# Default: true | Valid values: true, false
use_jit = true

# =============================================================================
# Bitboard Settings
# =============================================================================
[bitboard]
# Use bitboard representation (row-based uint32 arrays with Numba JIT).
# Provides faster board operations when enabled.
# Default: false | Valid values: true, false
enabled = true

# =============================================================================
# Recording Settings
# =============================================================================
[recording]
# Enable automatic game recording — writes JSON + MD5 checksum after each move.
# Default: false | Valid values: true, false
enabled = false

# Directory where recorded game files are saved (relative or absolute path).
# Default: "recordings"
directory = "recordings"

# =============================================================================
# Diagnostics Settings
# =============================================================================
[diagnostics]
# Enable per-move diagnostics recording — writes a .diag.jsonl file with
# brain internals (decision path, search stats, threats, candidates) for
# post-game investigation.
# Default: false | Valid values: true, false
enabled = false

# Directory where diagnostics files are saved (relative or absolute path).
# Uses the same gomoku_{timestamp} naming convention as recordings.
# Default: "recordings"
directory = "recordings"

# Maximum number of top candidate moves to record per move entry.
# Default: 10 | Valid range: 1–50
top_candidates = 10
